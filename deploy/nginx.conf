# Example reverse proxy. Put this in /etc/nginx/conf.d/ipapi.conf and adjust
# server_name / TLS paths. The API itself binds 127.0.0.1 only.

limit_req_zone $binary_remote_addr zone=ipapi:10m rate=20r/s;

# The browser UI is a single ~30 KB HTML document; it compresses to a few KB.
gzip on;
gzip_types text/html application/json;
gzip_min_length 1024;

server {
    listen 443 ssl http2;
    server_name ip.example.com;

    ssl_certificate     /etc/letsencrypt/live/ip.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip.example.com/privkey.pem;

    location / {
        limit_req zone=ipapi burst=40 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The API reads X-Forwarded-For when ?q= is omitted, so that a bare
        # GET / returns the caller's address rather than the proxy's.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # A cold RDAP lookup can take a few hundred milliseconds.
        proxy_read_timeout 15s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }
}
