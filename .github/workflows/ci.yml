name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

      - name: Check that the release packages build
        run: |
          make release ARCH=amd64
          make release ARCH=arm64
          ls -lh dist/*.tar.gz

      - name: Check shell scripts
        run: |
          for f in scripts/*.sh deploy/*.sh; do bash -n "$f"; done
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh deploy/*.sh

      - name: Validate systemd units
        run: |
          # systemd-analyze parses unit syntax without installing anything. The
          # units reference binaries under /opt/ipapi, which only exist on a
          # deployed host, so that one error is filtered out; anything else
          # (an unknown directive, a malformed value) fails the build.
          status=0
          for f in deploy/*.service deploy/*.timer; do
            echo "== $f"
            out="$(systemd-analyze verify --man=no "$f" 2>&1 || true)"
            out="$(echo "$out" | grep -v 'is not executable: No such file or directory' || true)"
            if [ -n "$out" ]; then echo "$out"; status=1; fi
          done
          exit $status
