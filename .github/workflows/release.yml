name: release

# Pushing a v* tag publishes a release with static Linux tarballs attached.
# The workflow can also be run by hand against an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting, vet and build
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
          go vet ./...
          go build ./...

      - name: Build release packages
        run: |
          make release ARCH=amd64
          make release ARCH=arm64

      - name: Smoke test the amd64 binary
        run: |
          # The runner is amd64, so the packaged binary runs here. Pointed at a
          # missing database directory it must exit with a clear message rather
          # than crash, which proves it links and starts.
          tar -xzf dist/ipapi-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          out="$("$RUNNER_TEMP/bin/ipapi-server" -mmdb /nonexistent 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "cannot open databases"
          file "$RUNNER_TEMP/bin/ipapi-server" | grep -q "statically linked"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ipapi-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          cat > dist/NOTES.md <<'NOTES'
          自建 IP 查询接口。静态链接，服务器无需安装 Go。

          ## 安装

          ```bash
          mkdir -p /tmp/ipapi
          tar -xzf ipapi-linux-amd64.tar.gz -C /tmp/ipapi
          sudo /tmp/ipapi/deploy/install.sh
          ```

          安装脚本会创建 `ipapi` 系统用户、部署到 `/opt/ipapi`、下载并构建数据库、
          注册 systemd 服务与每周自动更新定时器。服务器需要 `curl`、`unzip`、`gzip`。

          ARM 服务器请使用 `ipapi-linux-arm64.tar.gz`。
          校验完整性：`sha256sum -c SHA256SUMS`。
          NOTES
          cat dist/NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          assets=(dist/ipapi-linux-amd64.tar.gz dist/ipapi-linux-arm64.tar.gz dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, replacing assets"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes-file dist/NOTES.md \
              --generate-notes
          fi
